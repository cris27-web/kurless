<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Password entry for the Kurless ACM shop." />
    <title>Password | Kurless ACM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Quantico&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="access-page">
    <main>
        <section class="subscription-section">
            <div class="container access-panel">
                <a href="index.html" aria-label="Kurless home">
                    <img src="assets/images/logo.png" alt="Kurless ACM" class="subscription-section__logo" />
                </a>
                <p class="eyebrow">Private access</p>
                <h1 class="access-panel__title">Enter the shop</h1>
                <p class="access-panel__copy">Use the release password to unlock the current ACM drop.</p>

                <form id="login-form" class="subscription-form">
                    <input type="text" name="_gotcha" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true" />
                    <label class="sr-only" for="password">Password</label>
                    <input type="password" name="password" id="password" class="subscription-form__input" placeholder="Password" autocomplete="current-password" required />
                    <button type="submit" class="subscription-form__button">Enter</button>
                </form>

                <p class="enter-password-link">
                    <a href="emailsub.html" class="password-link">Join the release list</a>
                </p>
                <div id="form-message" class="form-message" aria-live="polite"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer__container">
            <p class="footer__text">&copy; 2026 KurlessACM. All rights reserved.</p>
            <a href="index.html" class="footer__link">Home</a>
        </div>
    </footer>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (event) => {
            event.preventDefault();

            const password = document.getElementById('password').value;
            const formMessage = document.getElementById('form-message');
            formMessage.textContent = '';

            try {
                const response = await fetch('/.netlify/functions/verifyPassword', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password })
                });
                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('authenticated', 'true');
                    formMessage.innerHTML = '<p class="subscription-form__success">Access granted. Redirecting...</p>';
                    setTimeout(() => {
                        const params = new URLSearchParams(window.location.search);
                        window.location.href = params.get('next') || 'shop.html';
                    }, 700);
                    return;
                }

                formMessage.innerHTML = `<p class="subscription-form__error">${data.message || 'Incorrect password.'}</p>`;
            } catch (error) {
                console.error('Error:', error);
                formMessage.innerHTML = '<p class="subscription-form__error">Unable to check the password. Please try again.</p>';
            }
        });
    </script>
</body>
</html>
